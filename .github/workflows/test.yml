name: Test
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  unit:
    name: Unit tests (worker logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy python-docx "flet>=0.86.0" "flet-webview-all>=0.1.8"
      - run: python -m unittest discover -s worker -p "test_*.py" -v
      - run: python -m unittest discover -s ui -p "test_*.py" -v
