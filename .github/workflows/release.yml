name: Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-worker.txt -r requirements-ui.txt
      - run: flet build windows --product "Стенограф" --org stenograph --description "Локальный диктофон: речь -> задачи -> протокол"
      - uses: actions/upload-artifact@v4
        with:
          name: stenograph-windows
          path: build/windows/**
