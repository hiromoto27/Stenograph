[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stenograph-local"
version = "0.2.0"
description = "Offline Windows meeting recorder and personal knowledge workspace"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6>=6.8,<7", "numpy>=1.26,<3", "scipy>=1.13,<2",
  "psutil>=6,<8", "faster-whisper>=1.1,<2", "pydantic>=2.9,<3",
  "PyAudioWPatch>=0.2.12.7,<0.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
embedded = ["llama-cpp-python>=0.3.16,<0.4"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyinstaller>=6.11,<7"]

[project.scripts]
stenograph = "stenograph.__main__:main"

[tool.setuptools.packages.find]
include = ["stenograph*"]

[tool.setuptools.package-data]
stenograph = ["resources/*.json", "resources/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
