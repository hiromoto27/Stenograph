<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<title>Stenograf browser STT</title>
<style>body{font-family:system-ui;background:#0B0C0E;color:#9A9B97;margin:12px;font-size:12px}</style>
</head>
<body>
<div id="s">Web Speech: idle</div>
<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const status = document.getElementById('s');
let rec = null;
let uid = 'u-0';
function post(obj) {
  const payload = JSON.stringify(obj);
  try {
    // flet-webview-all bridges JS -> Python through a named channel object,
    // registered on the Python side via javascript_channels=["StenografBridge"]
    // (ui/browser_stt.py JS_CHANNEL) — not window.chrome.webview.postMessage,
    // that's the raw native WebView2 API and isn't what this Flutter-hosted
    // WebView exposes.
    if (window.StenografBridge && window.StenografBridge.postMessage) {
      window.StenografBridge.postMessage(payload);
      return;
    }
  } catch (e) {}
  console.log('STT (no StenografBridge channel)', payload);
}
function ensure() {
  if (!SR) { status.textContent = 'SpeechRecognition недоступен'; return null; }
  if (rec) return rec;
  rec = new SR();
  rec.lang = 'ru-RU';
  rec.continuous = true;
  rec.interimResults = true;
  rec.onstart = () => { status.textContent = 'слушаю…'; };
  rec.onerror = (e) => { status.textContent = 'error: ' + (e.error || e.message); post({type:'error', error: String(e.error||e.message)}); };
  rec.onend = () => { status.textContent = 'paused'; };
  rec.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t; else interim += t;
    }
    if (interim) post({type:'partial', utterance_id: uid, text: interim, engine:'browser'});
    if (final) post({type:'final', utterance_id: uid, text: final.trim(), engine:'browser'});
  };
  return rec;
}
window.stenografStart = function(id) {
  uid = id || ('u-' + Date.now());
  const r = ensure();
  if (!r) return;
  try { r.start(); } catch (e) { status.textContent = String(e); }
};
window.stenografStop = function() {
  if (rec) { try { rec.stop(); } catch (e) {} }
  status.textContent = 'idle';
};
</script>
</body>
</html>
